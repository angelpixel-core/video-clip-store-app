name: Infra Render

on:
  pull_request:
    paths:
      - "ops/infra/render/**"
      - ".github/workflows/infra-render.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Render environment to apply"
        required: true
        type: choice
        options:
          - qa

permissions:
  contents: read

jobs:
  discover:
    name: Discover Terraform files
    runs-on: ubuntu-latest
    outputs:
      has_files: ${{ steps.scan.outputs.has_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for Terraform files
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          if find ops/infra/render -type f \( -name '*.tf' -o -name '*.tfvars' -o -name '*.tfvars.json' \) | grep -q .; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    needs: discover
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        if: needs.discover.outputs.has_files == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        if: needs.discover.outputs.has_files == 'true'
        run: terraform fmt -check -recursive ops/infra/render

      - name: Skip fmt when no Terraform files exist
        if: needs.discover.outputs.has_files != 'true'
        run: echo "No Terraform files found under ops/infra/render; skipping fmt."

  validate:
    name: validate
    runs-on: ubuntu-latest
    needs: discover
    if: github.event_name == 'pull_request'
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TF_VAR_owner_id: ${{ vars.RENDER_OWNER_ID }}
      TF_VAR_adopted_web_service_id: ${{ vars.RENDER_QA_ADOPTED_WEB_SERVICE_ID }}
      TF_VAR_adopted_database_id: ${{ vars.RENDER_QA_ADOPTED_DATABASE_ID }}
      TF_VAR_adopted_environment_id: ${{ vars.RENDER_QA_ADOPTED_ENVIRONMENT_ID }}
      TF_VAR_rails_master_key: ${{ secrets.RAILS_MASTER_KEY }}
      TF_VAR_environment_id: ${{ vars.RENDER_QA_ENVIRONMENT_ID }}
      TF_VAR_aws_access_key_id: ${{ secrets.RENDER_QA_AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_access_key: ${{ secrets.RENDER_QA_AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_region: ${{ vars.RENDER_QA_AWS_REGION }}
      TF_VAR_aws_bucket: ${{ vars.RENDER_QA_AWS_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        if: needs.discover.outputs.has_files == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        if: needs.discover.outputs.has_files == 'true'
        run: terraform -chdir=ops/infra/render/envs/qa init -input=false -backend=false

      - name: Set optional Terraform variables
        if: needs.discover.outputs.has_files == 'true'
        run: |
          if [ -n "${{ vars.RENDER_QA_AWS_ENDPOINT }}" ]; then
            echo "TF_VAR_aws_endpoint=${{ vars.RENDER_QA_AWS_ENDPOINT }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.RENDER_QA_AWS_FORCE_PATH_STYLE }}" ]; then
            echo "TF_VAR_aws_force_path_style=${{ vars.RENDER_QA_AWS_FORCE_PATH_STYLE }}" >> "$GITHUB_ENV"
          fi

      - name: Terraform validate
        if: needs.discover.outputs.has_files == 'true'
        run: terraform -chdir=ops/infra/render/envs/qa validate

      - name: Skip validate when no Terraform files exist
        if: needs.discover.outputs.has_files != 'true'
        run: echo "No Terraform files found under ops/infra/render; skipping validate."

  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: discover
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        environment: [qa]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        if: needs.discover.outputs.has_files == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Configure Render API key
        if: needs.discover.outputs.has_files == 'true'
        run: |
          echo "RENDER_API_KEY=${{ secrets.RENDER_API_KEY }}" >> "$GITHUB_ENV"
          echo "TF_VAR_owner_id=${{ vars.RENDER_OWNER_ID }}" >> "$GITHUB_ENV"
          echo "TF_VAR_adopted_web_service_id=${{ vars.RENDER_QA_ADOPTED_WEB_SERVICE_ID }}" >> "$GITHUB_ENV"
          echo "TF_VAR_adopted_database_id=${{ vars.RENDER_QA_ADOPTED_DATABASE_ID }}" >> "$GITHUB_ENV"
          echo "TF_VAR_adopted_environment_id=${{ vars.RENDER_QA_ADOPTED_ENVIRONMENT_ID }}" >> "$GITHUB_ENV"
          echo "TF_VAR_aws_access_key_id=${{ secrets.RENDER_QA_AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "TF_VAR_aws_secret_access_key=${{ secrets.RENDER_QA_AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "TF_VAR_aws_region=${{ vars.RENDER_QA_AWS_REGION }}" >> "$GITHUB_ENV"
          echo "TF_VAR_aws_bucket=${{ vars.RENDER_QA_AWS_BUCKET }}" >> "$GITHUB_ENV"

      - name: Set Terraform variables
        if: needs.discover.outputs.has_files == 'true'
        run: |
          case "${{ matrix.environment }}" in
            qa)
              echo "TF_VAR_rails_master_key=${{ secrets.RAILS_MASTER_KEY }}" >> "$GITHUB_ENV"
              echo "TF_VAR_environment_id=${{ vars.RENDER_QA_ENVIRONMENT_ID }}" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Terraform init
        if: needs.discover.outputs.has_files == 'true'
        run: terraform -chdir=ops/infra/render/envs/${{ matrix.environment }} init -input=false -backend=false

      - name: Set optional Terraform variables
        if: needs.discover.outputs.has_files == 'true'
        run: |
          if [ -n "${{ vars.RENDER_QA_AWS_ENDPOINT }}" ]; then
            echo "TF_VAR_aws_endpoint=${{ vars.RENDER_QA_AWS_ENDPOINT }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.RENDER_QA_AWS_FORCE_PATH_STYLE }}" ]; then
            echo "TF_VAR_aws_force_path_style=${{ vars.RENDER_QA_AWS_FORCE_PATH_STYLE }}" >> "$GITHUB_ENV"
          fi

      - name: Terraform plan
        if: needs.discover.outputs.has_files == 'true'
        run: terraform -chdir=ops/infra/render/envs/${{ matrix.environment }} plan -input=false

      - name: Skip plan when no Terraform files exist
        if: needs.discover.outputs.has_files != 'true'
        run: echo "No Terraform files found under ops/infra/render; skipping plan for ${{ matrix.environment }}."

  apply:
    name: apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: discover
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TF_VAR_owner_id: ${{ vars.RENDER_OWNER_ID }}
      TF_VAR_adopted_web_service_id: ${{ vars.RENDER_QA_ADOPTED_WEB_SERVICE_ID }}
      TF_VAR_adopted_database_id: ${{ vars.RENDER_QA_ADOPTED_DATABASE_ID }}
      TF_VAR_adopted_environment_id: ${{ vars.RENDER_QA_ADOPTED_ENVIRONMENT_ID }}
      TF_VAR_rails_master_key: ${{ secrets.RAILS_MASTER_KEY }}
      TF_VAR_environment_id: ${{ vars.RENDER_QA_ENVIRONMENT_ID }}
      TF_VAR_aws_access_key_id: ${{ secrets.RENDER_QA_AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_access_key: ${{ secrets.RENDER_QA_AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_region: ${{ vars.RENDER_QA_AWS_REGION }}
      TF_VAR_aws_bucket: ${{ vars.RENDER_QA_AWS_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        if: needs.discover.outputs.has_files == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        if: needs.discover.outputs.has_files == 'true'
        run: terraform -chdir=ops/infra/render/envs/${{ inputs.environment }} init -input=false

      - name: Set optional Terraform variables
        if: needs.discover.outputs.has_files == 'true'
        run: |
          if [ -n "${{ vars.RENDER_QA_AWS_ENDPOINT }}" ]; then
            echo "TF_VAR_aws_endpoint=${{ vars.RENDER_QA_AWS_ENDPOINT }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.RENDER_QA_AWS_FORCE_PATH_STYLE }}" ]; then
            echo "TF_VAR_aws_force_path_style=${{ vars.RENDER_QA_AWS_FORCE_PATH_STYLE }}" >> "$GITHUB_ENV"
          fi

      - name: Terraform apply
        if: needs.discover.outputs.has_files == 'true'
        run: terraform -chdir=ops/infra/render/envs/${{ inputs.environment }} apply -auto-approve -input=false

      - name: Skip apply when no Terraform files exist
        if: needs.discover.outputs.has_files != 'true'
        run: echo "No Terraform files found under ops/infra/render; skipping apply for ${{ inputs.environment }}."
